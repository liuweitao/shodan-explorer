version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    versioning-strategy: increase
    ignore:
      # TypeScript 7 is outside typescript-eslint's supported peer range.
      - dependency-name: typescript
        versions:
          - ">=7"
    groups:
      vue-toolchain:
        patterns:
          - "vue"
          - "@vue/*"
          - "vite"
          - "@vitejs/*"
      quality-toolchain:
        dependency-type: development
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "typescript"
          - "typescript-eslint"
          - "vitest"
          - "prettier"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Node 26 no longer bundles Corepack and is not an LTS release yet.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
