version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    versioning-strategy: increase
    open-pull-requests-limit: 2
    # Keep Dependabot behind pnpm's seven-day package maturity gate. The extra
    # day avoids boundary failures caused by different run times and time zones.
    cooldown:
      default-days: 8
    ignore:
      # TypeScript 7 is outside typescript-eslint's supported peer range.
      - dependency-name: typescript
        versions:
          - ">=7"
      # Keep Node.js types aligned with the Node 24 runtime target.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      frontend-toolchain:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /frontend
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    groups:
      container-images:
        patterns:
          - "*"
    ignore:
      # Stay on the Node 24 LTS line; major upgrades need a toolchain review.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
