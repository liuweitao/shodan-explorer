worker_processes auto;
pid /tmp/nginx.pid;

# Upstream errors can include the original request URI. Keep this at critical
# level because Shodan-compatible query strings contain credentials.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log the normalized path only. Shodan-compatible requests carry credentials
    # in the query string, so logging $request or $request_uri would expose keys.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent '
                    '"$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;

    include /tmp/nginx-conf.d/*.conf;
}
