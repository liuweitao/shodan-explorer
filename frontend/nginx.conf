server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header_inherit merge;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /runtime-config.json {
        alias /tmp/runtime-config.json;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Never expose shodan-proxy's administrative surface through the public UI.
    location ~ ^/(?:admin|login|logout|update-config|get-config|api/shodan-keys|static)(?:/|$) {
        return 404;
    }

    # Only documented Shodan-compatible API prefixes are forwarded.
    location ~ ^/(?:shodan|dns|notifier|org)(?:/|$) {
        proxy_pass ${SHODAN_BASE_URL};
        include /etc/nginx/shodan-proxy-params.conf;
    }

    location ~ ^/account(?:/|$) {
        proxy_pass ${SHODAN_BASE_URL};
        include /etc/nginx/shodan-proxy-params.conf;
    }

    location ~ ^/tools/(?:httpheaders|myip)$ {
        proxy_pass ${SHODAN_BASE_URL};
        include /etc/nginx/shodan-proxy-params.conf;
    }

    location = /api-info {
        proxy_pass ${SHODAN_BASE_URL};
        include /etc/nginx/shodan-proxy-params.conf;
    }

    location ~* \.(?:css|gif|ico|jpe?g|js|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
